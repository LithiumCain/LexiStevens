      <ellipse cx="1180" cy="470" rx="320" ry="40" fill="#7f95a8" opacity=".5"/>
      <ellipse cx="360" cy="620" rx="300" ry="46" fill="#4a6884" opacity=".6"/>
      <ellipse cx="1220" cy="740" rx="280" ry="40" fill="#1f2f40" opacity=".55"/>
      <ellipse cx="600" cy="900" rx="420" ry="60" fill="#2f4458" opacity=".6"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M-60,300 C160,250 330,350 560,300 C780,252 930,330 1140,286 C1330,248 1480,320 1660,282" stroke="url(#gold)" stroke-width="4"/>
      <path d="M-60,312 C200,280 360,352 600,312 C820,276 980,336 1200,300" stroke="url(#gold2)" stroke-width="1" opacity=".7"/>
      <path d="M-60,420 C190,380 380,470 640,416 C860,372 1020,452 1240,408 C1420,374 1540,430 1660,404" stroke="url(#gold2)" stroke-width="3"/>
      <path d="M-60,560 C220,510 420,610 700,552 C940,504 1120,600 1360,548 C1500,520 1580,560 1660,544" stroke="url(#gold)" stroke-width="5"/>
      <path d="M300,574 C520,600 760,548 1000,580 C1180,602 1340,566 1500,578" stroke="url(#gold)" stroke-width="1" opacity=".55"/>
      <path d="M-60,690 C200,650 460,740 760,684 C1000,640 1200,730 1440,680 C1540,660 1600,690 1660,676" stroke="url(#gold2)" stroke-width="3.2"/>
      <path d="M-60,820 C260,780 520,860 820,810 C1080,770 1300,850 1660,800" stroke="url(#gold)" stroke-width="2.4" opacity=".85"/>
      <path d="M-60,742 C260,724 520,770 820,738 C1060,712 1300,760 1660,730" stroke="url(#gold2)" stroke-width="1.2" opacity=".6"/>
      <path d="M200,470 C420,452 640,490 900,466 C1100,448 1300,480 1500,462" stroke="url(#gold)" stroke-width="1.2" opacity=".5"/>
    </g>
  </g>
  <rect width="1600" height="1000" fill="#fff" filter="url(#streak)" opacity=".35"/>
  <rect width="1600" height="1000" fill="#fff" filter="url(#paper)"/>
