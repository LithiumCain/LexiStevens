    <path d="M-60,560 C220,510 420,610 700,552 C940,504 1120,600 1360,548 C1500,520 1580,560 1660,544 V1060 H-60Z" fill="url(#b3)"/>
    <path d="M-60,690 C200,650 460,740 760,684 C1000,640 1200,730 1440,680 C1540,660 1600,690 1660,676 V1060 H-60Z" fill="url(#b4)"/>
    <path d="M-60,820 C260,780 520,860 820,810 C1080,770 1300,850 1660,800 V1060 H-60Z" fill="url(#b5)"/>
    <g filter="url(#wash)">
